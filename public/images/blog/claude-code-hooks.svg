<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Cycle de vie d'un appel d'outil : le hook PreToolUse decide avant les regles de permission, PostToolUse verifie apres l'ecriture, Stop controle en fin de session">
  <defs>
    <radialGradient id="bgh" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#161022" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52525b"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="url(#bgh)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#a1a1aa" letter-spacing="2">CYCLE DE VIE D'UN APPEL D'OUTIL</text>

  <!-- Etape 1 : appel -->
  <g transform="translate(36, 62)">
    <rect x="0" y="0" width="150" height="58" rx="9" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="75" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="#e4e4e7" font-weight="700">APPEL D'OUTIL</text>
    <text x="75" y="43" text-anchor="middle" font-family="monospace" font-size="8" fill="#71717a">Read, Edit, Write</text>
  </g>
  <line x1="186" y1="91" x2="238" y2="91" stroke="#52525b" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Etape 2 : PreToolUse -->
  <g transform="translate(244, 52)">
    <rect x="0" y="0" width="182" height="78" rx="9" fill="#1a1206" stroke="#f59e0b" stroke-width="2"/>
    <text x="91" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#fbbf24" font-weight="700">1. PreToolUse</text>
    <text x="91" y="43" text-anchor="middle" font-family="monospace" font-size="9" fill="#e4e4e7">sortie 2 = BLOQUE</text>
    <text x="91" y="61" text-anchor="middle" font-family="monospace" font-size="8" fill="#a1a1aa">prime sur les permissions</text>
  </g>
  <line x1="426" y1="91" x2="478" y2="91" stroke="#52525b" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Etape 3 : permissions -->
  <g transform="translate(484, 52)">
    <rect x="0" y="0" width="182" height="78" rx="9" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="91" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#d4d4d8" font-weight="700">2. PERMISSIONS</text>
    <text x="91" y="43" text-anchor="middle" font-family="monospace" font-size="9" fill="#e4e4e7">allow / deny</text>
    <text x="91" y="61" text-anchor="middle" font-family="monospace" font-size="8" fill="#71717a">chemin, pas intention</text>
  </g>

  <!-- Descente vers execution -->
  <line x1="575" y1="130" x2="575" y2="168" stroke="#52525b" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Etape 4 : execution -->
  <g transform="translate(484, 174)">
    <rect x="0" y="0" width="182" height="58" rx="9" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="91" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="#e4e4e7" font-weight="700">EXECUTION</text>
    <text x="91" y="43" text-anchor="middle" font-family="monospace" font-size="8" fill="#71717a">le fichier est ecrit</text>
  </g>
  <line x1="484" y1="203" x2="432" y2="203" stroke="#52525b" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Etape 5 : PostToolUse -->
  <g transform="translate(244, 164)">
    <rect x="0" y="0" width="182" height="78" rx="9" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
    <text x="91" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#60a5fa" font-weight="700">3. PostToolUse</text>
    <text x="91" y="43" text-anchor="middle" font-family="monospace" font-size="9" fill="#e4e4e7">regles vs schema</text>
    <text x="91" y="61" text-anchor="middle" font-family="monospace" font-size="8" fill="#a1a1aa">avertit, sortie 0</text>
  </g>

  <!-- Etape 6 : Stop -->
  <g transform="translate(244, 282)">
    <rect x="0" y="0" width="422" height="86" rx="9" fill="#140b1f" stroke="#a855f7" stroke-width="2"/>
    <text x="211" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#c4b5fd" font-weight="700">4. Stop, fin de session</text>
    <text x="211" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#e4e4e7">git rev-list --count origin/main..HEAD</text>
    <text x="211" y="63" text-anchor="middle" font-family="monospace" font-size="9" fill="#e4e4e7">CLAUDE.md, renvois morts, fiches hors index</text>
    <text x="211" y="79" text-anchor="middle" font-family="monospace" font-size="8" fill="#a1a1aa">un commit local ne livre rien</text>
  </g>
  <line x1="335" y1="242" x2="335" y2="276" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fleche)"/>

  <!-- Legende laterale -->
  <g transform="translate(36, 174)">
    <rect x="0" y="0" width="150" height="194" rx="9" fill="#101013" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="26" font-family="monospace" font-size="9" fill="#d4d4d8" font-weight="700">CODES DE SORTIE</text>
    <text x="14" y="52" font-family="monospace" font-size="9" fill="#f87171">2</text>
    <text x="32" y="52" font-family="monospace" font-size="9" fill="#a1a1aa">bloque l'appel</text>
    <text x="14" y="72" font-family="monospace" font-size="9" fill="#4ade80">0</text>
    <text x="32" y="72" font-family="monospace" font-size="9" fill="#a1a1aa">laisse passer</text>

    <line x1="14" y1="92" x2="136" y2="92" stroke="#27272a" stroke-width="1"/>

    <text x="14" y="116" font-family="monospace" font-size="9" fill="#d4d4d8" font-weight="700">SORTIE stderr</text>
    <text x="14" y="138" font-family="monospace" font-size="8" fill="#a1a1aa">lue par l'agent,</text>
    <text x="14" y="153" font-family="monospace" font-size="8" fill="#a1a1aa">pas par l'humain</text>

    <line x1="14" y1="168" x2="136" y2="168" stroke="#27272a" stroke-width="1"/>

    <text x="14" y="186" font-family="monospace" font-size="8" fill="#71717a">3 hooks sur 4 avertissent</text>
  </g>
</svg>
