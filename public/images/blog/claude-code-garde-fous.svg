<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Quatre garde-fous encadrant un agent de code : blocage des secrets, verification des regles, avertissement sur les commits non pousses, controle de la configuration">
  <defs>
    <radialGradient id="bgcc" cx="70%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#07200f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgcc)" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#a1a1aa" letter-spacing="2">ENCADRER UN AGENT DE CODE : LES GARDE-FOUS</text>

  <!-- Agent au centre -->
  <g transform="translate(310, 178)">
    <rect x="0" y="0" width="180" height="64" rx="10" fill="#12141a" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="27" text-anchor="middle" font-family="monospace" font-size="12" fill="#86efac" font-weight="700">AGENT DE CODE</text>
    <text x="90" y="46" text-anchor="middle" font-family="monospace" font-size="9" fill="#71717a">lit, ecrit, commite</text>
  </g>

  <!-- Hook 1 : PreToolUse, secrets -->
  <g transform="translate(40, 62)">
    <rect x="0" y="0" width="230" height="96" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="10" fill="#fbbf24" font-weight="700">PreToolUse</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#e4e4e7">Lecture .env BLOQUEE</text>
    <text x="14" y="60" font-family="monospace" font-size="9" fill="#e4e4e7">Ecriture .env autorisee</text>
    <text x="14" y="80" font-family="monospace" font-size="8" fill="#71717a">prime sur les permissions</text>
  </g>
  <line x1="270" y1="110" x2="330" y2="176" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Hook 2 : PostToolUse, regles -->
  <g transform="translate(530, 62)">
    <rect x="0" y="0" width="230" height="96" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="10" fill="#60a5fa" font-weight="700">PostToolUse</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#e4e4e7">regles vs schema.prisma</text>
    <text x="14" y="60" font-family="monospace" font-size="9" fill="#e4e4e7">identifiant inexistant</text>
    <text x="14" y="80" font-family="monospace" font-size="8" fill="#71717a">avertit, ne bloque pas</text>
  </g>
  <line x1="530" y1="110" x2="470" y2="176" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Hook 3 : Stop, commits -->
  <g transform="translate(40, 268)">
    <rect x="0" y="0" width="230" height="96" rx="10" fill="#18181b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="10" fill="#c4b5fd" font-weight="700">Stop</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#e4e4e7">commits absents de main</text>
    <text x="14" y="62" font-family="monospace" font-size="8" fill="#71717a">git log origin/main..HEAD</text>
    <text x="14" y="80" font-family="monospace" font-size="8" fill="#71717a">un commit local ne livre rien</text>
  </g>
  <line x1="270" y1="310" x2="330" y2="244" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Hook 4 : Stop, config -->
  <g transform="translate(530, 268)">
    <rect x="0" y="0" width="230" height="96" rx="10" fill="#18181b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="10" fill="#86efac" font-weight="700">Stop</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#e4e4e7">CLAUDE.md sous 200 lignes</text>
    <text x="14" y="62" font-family="monospace" font-size="9" fill="#e4e4e7">renvoi mort, fiche hors index</text>
    <text x="14" y="80" font-family="monospace" font-size="8" fill="#71717a">controle la config elle-meme</text>
  </g>
  <line x1="530" y1="310" x2="470" y2="244" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>

  <text x="400" y="400" text-anchor="middle" font-family="monospace" font-size="9" fill="#71717a">l'ecart entre ce que le projet est et ce qu'il dit de lui-meme</text>
</svg>
